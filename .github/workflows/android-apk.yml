name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "app/**"
      - "yt_navigator/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs the same Python version on the build machine as the one bundled in the APK
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check the built-in API keys
        env:
          DEFAULT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEFAULT_COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python android/check-keys.py

      - name: Build debug APK
        working-directory: android
        env:
          # Built-in keys (repository secrets); clients can replace them in the app's Settings page
          DEFAULT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEFAULT_COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk yt-navigator.apk

      # Download it from the run's "Artifacts" section (a zip containing yt-navigator.apk)
      - uses: actions/upload-artifact@v4
        with:
          name: yt-navigator-apk
          path: yt-navigator.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash android/smoke-test.sh yt-navigator.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-output
          path: smoke-test-output
